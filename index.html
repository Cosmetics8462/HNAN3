            margin-bottom: 20px;

        /* زر أيقونة الواتساب الوسطى مع مسافات متناسقة */
        .whatsapp-circle-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            background: linear-gradient(145deg, #25d366, #128c7e);
            border-radius: 50%;
            margin: 0 auto 12px auto;
            box-shadow: 0 15px 35px rgba(37, 211, 102, 0.35);
            text-decoration: none;
            cursor: pointer;
            position: relative;
            z-index: 10;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .whatsapp-circle-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 20px 45px rgba(37, 211, 102, 0.45);
        }
        .whatsapp-circle-btn:active {
            transform: scale(0.92);
            background: linear-gradient(145deg, #128c7e, #075e54);
        }
        .whatsapp-circle-btn svg {
            width: 52px;
            height: 52px;
            fill: #ffffff;
        }
        .action-label {
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 4px;
        }
        .action-sub {
            font-size: 13px;
            color: #aaaaaa;
            font-weight: 500;
            margin-bottom: 14px;

            line-height: 1.7;
            max-width: 350px;
            margin: 0 auto;
            font-weight: 400;

        .whatsapp-bottom-bar {

            color: #ffffff;
            padding: 15px 22px;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 90%;
            max-width: 400px;
            margin: 0 auto 70px auto; /* تم رفع الزر بمقدار 50 بكسل إضافية عن السابق */
            border-radius: 50px;
            cursor: pointer;
            position: relative;
            z-index: 10;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.25);
            transition: all 0.15s ease;
        }
        .whatsapp-bottom-bar:active {
            transform: scale(0.97);
            background-color: #128c7e;
        }
        .whatsapp-bottom-bar svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
